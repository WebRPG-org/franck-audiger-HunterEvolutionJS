name: Déploiement Release + Installer Windows

on:
  push:
    tags:
      - '*'

jobs:
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/')
    runs-on: self-hosted

    env:
      DEST_WEB: /var/www
      BUILD_ROOT: /var/www/workspace/buildDesktop
      APP_DIR: /var/www/workspace/buildDesktop/Hunter            # dossier du build desktop
      APP_PAYLOAD: /var/www/workspace/buildDesktop/Hunter        # ce qu'on installe
      INSTALLER_DIR: /var/www/desktop                        # où déposer l'EXE final
      # --- Android ---
      ANDROID_ROOT: /var/www/workspace/buildAndroid
      ANDROID_APP: /var/www/workspace/buildAndroid/Hunter            # projet Cordova
      ANDROID_SDK_ROOT: /opt/hunter/android-sdk
      ANDROID_BUILD_TOOLS: 34.0.0
      ANDROID_PLATFORM: android-34
      ANDROID_OUT_DIR: /var/www/android

    steps:
      - name: Prepare (cloner le tag et copier workspace)
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          echo "🏷 TAG: ${TAG_NAME}"

          rm -rf ./tmpRelease
          mkdir ./tmpRelease
          cd ./tmpRelease

          echo "📥 Clone du repo @ tag ${TAG_NAME}"
          git clone --branch "${TAG_NAME}" --depth 1 https://github.com/franck-audiger/HunterEvolutionJS.git .

          echo "🔎 Vérifications de base…"
          for d in data fonts js icon img audio movies workspace; do
            [ -d "./$d" ] || { echo "❌ Dossier manquant: $d"; exit 1; }
          done

          cd ..

      - name: Release (copie vers /var/www)
        run: |
          set -euo pipefail

          DEST_GAME="${DEST_WEB}/game"

          [ -d "./tmpRelease" ] || { echo "❌ tmpRelease absent"; exit 1; }
          cd ./tmpRelease

          echo "📁 Prépare dossiers cibles…"
          mkdir -p \
            "${DEST_GAME}/data" "${DEST_GAME}/fonts" "${DEST_GAME}/icon" \
            "${DEST_GAME}/img" "${DEST_GAME}/audio" "${DEST_GAME}/movies" \
            "${DEST_GAME}/js"

          echo "📤 Copie assets vers ${DEST_GAME}"
          cp -vr ./data/*   "${DEST_GAME}/data/"
          cp -vr ./fonts/*  "${DEST_GAME}/fonts/"
          cp -vr ./icon/*   "${DEST_GAME}/icon/"
          cp -vr ./img/*    "${DEST_GAME}/img/"
          cp -vr ./audio/*  "${DEST_GAME}/audio/"
          cp -vr ./movies/* "${DEST_GAME}/movies/"
          cp -vr ./js/*     "${DEST_GAME}/js/"

          echo "🧱 Copie vers build web (Windows payload)"
          PAYLOAD_WWW="${BUILD_ROOT}/Hunter/www"
          mkdir -p \
            "${PAYLOAD_WWW}/data" "${PAYLOAD_WWW}/fonts" "${PAYLOAD_WWW}/icon" \
            "${PAYLOAD_WWW}/img" "${PAYLOAD_WWW}/audio" "${PAYLOAD_WWW}/movies" \
            "${PAYLOAD_WWW}/js"
          cp -vr ./data/*   "${PAYLOAD_WWW}/data/"
          cp -vr ./fonts/*  "${PAYLOAD_WWW}/fonts/"
          cp -vr ./icon/*   "${PAYLOAD_WWW}/icon/"
          cp -vr ./img/*    "${PAYLOAD_WWW}/img/"
          cp -vr ./audio/*  "${PAYLOAD_WWW}/audio/"
          cp -vr ./movies/* "${PAYLOAD_WWW}/movies/"
          cp -vr ./js/*     "${PAYLOAD_WWW}/js/"

          echo "🗂️  Fichiers site -> ${DEST_WEB}"
          mkdir -p "${DEST_WEB}/desktop"
          cp -v ./site/desktop/index.php   "${DEST_WEB}/desktop/index.php"
          cp -v ./site/bug-reports.php     "${DEST_WEB}/bug-reports.php"
          cp -v ./site/favicon.ico         "${DEST_WEB}/favicon.ico"
          cp -v ./site/feedback.php        "${DEST_WEB}/feedback.php"
          cp -v ./site/contact.php         "${DEST_WEB}/contact.php"
          cp -v ./site/icon.png            "${DEST_WEB}/icon.png"
          cp -v ./site/icon-144.png        "${DEST_WEB}/icon-144.png" || true
          cp -v ./site/icon-192.png        "${DEST_WEB}/icon-192.png" || true
          cp -v ./site/icon-36.png         "${DEST_WEB}/icon-36.png"  || true
          cp -v ./site/icon-48.png         "${DEST_WEB}/icon-48.png"  || true
          cp -v ./site/icon-72.png         "${DEST_WEB}/icon-72.png"  || true
          cp -v ./site/icon-96.png         "${DEST_WEB}/icon-96.png"  || true
          cp -v ./site/index.php           "${DEST_WEB}/index.php"
          cp -v ./site/lang.php            "${DEST_WEB}/lang.php"
          cp -v ./site/en.png              "${DEST_WEB}/en.png"        || true
          cp -v ./site/fr.png              "${DEST_WEB}/fr.png"        || true
          cp -v ./site/header.php          "${DEST_WEB}/header.php"
          cp -v ./site/release-note.php    "${DEST_WEB}/release-note.php"
          cp -v ./site/style.css           "${DEST_WEB}/style.css"

          cd ..

      - name: Générer l’installateur Windows (NSIS) + icône cohérente
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          mkdir -p "${INSTALLER_DIR}" "${APP_DIR}/www/icon"

          echo "🖼️  Conversion icon.png -> .ico pour l'installateur et les raccourcis"
          ICON_SRC=""
          if [ -f "${DEST_WEB}/icon.png" ]; then
            ICON_SRC="${DEST_WEB}/icon.png"
          elif [ -f "${APP_DIR}/www/icon/icon.png" ]; then
            ICON_SRC="${APP_DIR}/www/icon/icon.png"
          elif [ -f "${APP_DIR}/icon.png" ]; then
            ICON_SRC="${APP_DIR}/icon.png"
          else
            echo "❌ icon.png introuvable (cherche ${DEST_WEB}/icon.png en priorité)."; exit 1
          fi

          ICO_PATH="${BUILD_ROOT}/installer_icon.ico"
          if command -v magick >/dev/null 2>&1; then
            magick "${ICON_SRC}" -resize 256x256 "${ICO_PATH}"
          else
            convert "${ICON_SRC}" -resize 256x256 "${ICO_PATH}"
          fi

          cp -f "${ICO_PATH}" "${APP_DIR}/www/icon/icon.ico"

          echo "📝 Génération du script NSIS…"
          NSI="${BUILD_ROOT}/HunterInstaller.nsi"
          cat > "${NSI}" <<'NSIS'
          !include "MUI2.nsh"
          !include "FileFunc.nsh"
          !include "nsDialogs.nsh"
          !include "LogicLib.nsh"

          !define APP_NAME "HunterEvolution"
          !define COMPANY  "HunterEvolution"
          !define APP_VERSION "${TAG_NAME}"
          !define INSTALL_DIR "$PROGRAMFILES\HunterEvolution"
          !define STARTMENU_FOLDER "HunterEvolution"
          !define PAYLOAD_DIR "${APP_DIR}"
          !define OUT_EXE "${INSTALLER_DIR}/HunterEvolution-${TAG_NAME}.exe"

          ; --- Emplacement des sauvegardes ---
          !define SAVE_DIR "$APPDATA\HunterEvolution\save"
          !define LEGACY_SAVE_DIR "$INSTDIR\www\save"

          Var KeepSaves
          Var IsUpgrade
          Var SaveBackupDir

          Name "${APP_NAME} ${APP_VERSION}"
          OutFile "${OUT_EXE}"
          InstallDir "${INSTALL_DIR}"
          RequestExecutionLevel admin

          !define MUI_ABORTWARNING
          !define MUI_ICON "${ICO_PATH}"
          !define MUI_UNICON "${ICO_PATH}"

          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          Page custom PageKeepSavesCreate PageKeepSavesLeave
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "French"

          ;-------------------------
          ; Init
          ;-------------------------
          Function .onInit
            StrCpy $IsUpgrade "0"
            StrCpy $KeepSaves "0"
          FunctionEnd

          ;------------------------------------------
          ; Page custom : Conserver les sauvegardes ?
          ;------------------------------------------
          Function PageKeepSavesCreate
            StrCpy $IsUpgrade "0"

            ; Si le dossier d’installation contient déjà des fichiers, on suppose upgrade
            ${If} ${FileExists} "$INSTDIR\*.*"
              StrCpy $IsUpgrade "1"
            ${EndIf}

            ; Montrer la page seulement si upgrade + saves existantes
            ${If} $IsUpgrade == "1"
              ${If} ${FileExists} "${SAVE_DIR}\*.*"
                StrCpy $KeepSaves "1"
              ${ElseIf} ${FileExists} "${LEGACY_SAVE_DIR}\*.*"
                StrCpy $KeepSaves "1"
              ${Else}
                Abort ; pas de sauvegarde -> pas de page
              ${EndIf}

              nsDialogs::Create 1018
              Pop $0
              ${If} $0 == error
                Abort
              ${EndIf}

              ${NSD_CreateLabel} 0 0 100% 24u "Installation existante détectée.$\r$\nSouhaitez-vous conserver vos sauvegardes ?"
              Pop $1
              ${NSD_CreateCheckbox} 0 28u 100% 12u "Conserver mes sauvegardes"
              Pop $2
              ${If} $KeepSaves == "1"
                ${NSD_Check} $2
              ${EndIf}

              nsDialogs::Show
              ${NSD_GetState} $2 $KeepSaves
            ${Else}
              Abort ; fresh install -> pas de page
            ${EndIf}
          FunctionEnd

          Function PageKeepSavesLeave
            ; $KeepSaves est déjà défini
          FunctionEnd

          ;-------------------------
          ; Section d’installation
          ;-------------------------
          Section "Installer"
            SetOutPath "$INSTDIR"

            ; 1) Backup des sauvegardes si demandé
            StrCpy $SaveBackupDir "$TEMP\he_save_backup"
            ${If} $KeepSaves == "1"
              RMDir /r "$SaveBackupDir"
              CreateDirectory "$SaveBackupDir"
              ${If} ${FileExists} "${SAVE_DIR}\*.*"
                CreateDirectory "$SaveBackupDir\official"
                CopyFiles /SILENT "${SAVE_DIR}\*.*" "$SaveBackupDir\official\"
              ${EndIf}
              ${If} ${FileExists} "${LEGACY_SAVE_DIR}\*.*"
                CreateDirectory "$SaveBackupDir\legacy"
                CopyFiles /SILENT "${LEGACY_SAVE_DIR}\*.*" "$SaveBackupDir\legacy\"
              ${EndIf}
            ${EndIf}

            ; 2) Copie du payload
            File /r "${PAYLOAD_DIR}\*.*"

            ; 3) Choix de la cible pour les raccourcis
            StrCpy $0 "$INSTDIR\www\index.html"
            ${If} ${FileExists} "$INSTDIR\Game.exe"
              StrCpy $0 "$INSTDIR\Game.exe"
            ${Else}
              FindFirst $1 $2 "$INSTDIR\*.exe"
              StrCmp $2 "" +3 0
                StrCpy $0 "$INSTDIR\$2"
              FindClose $1
            ${EndIf}

            ; 4) Raccourcis
            CreateShortCut "$DESKTOP\HunterEvolution.lnk" "$0" "" "$INSTDIR\www\icon\icon.ico" 0
            CreateDirectory "$SMPROGRAMS\${STARTMENU_FOLDER}"
            CreateShortCut "$SMPROGRAMS\${STARTMENU_FOLDER}\HunterEvolution.lnk" "$0" "" "$INSTDIR\www\icon\icon.ico" 0

            ; 5) Restauration des sauvegardes
            ${If} $KeepSaves == "1"
              CreateDirectory "${SAVE_DIR}"
              ${If} ${FileExists} "$SaveBackupDir\official\*.*"
                CopyFiles /SILENT "$SaveBackupDir\official\*.*" "${SAVE_DIR}\"
              ${EndIf}
              ${If} ${FileExists} "$SaveBackupDir\legacy\*.*"
                CopyFiles /SILENT "$SaveBackupDir\legacy\*.*" "${SAVE_DIR}\"
              ${EndIf}
              RMDir /r "$SaveBackupDir"
            ${EndIf}

            ; 6) Désinstalleur
            WriteUninstaller "$INSTDIR\Uninstall.exe"
            CreateShortCut "$SMPROGRAMS\${STARTMENU_FOLDER}\Désinstaller HunterEvolution.lnk" "$INSTDIR\Uninstall.exe"
          SectionEnd

          ;-------------------------
          ; Section de désinstallation
          ;-------------------------
          Section "Uninstall"
            Delete "$DESKTOP\HunterEvolution.lnk"
            Delete "$SMPROGRAMS\${STARTMENU_FOLDER}\HunterEvolution.lnk"
            Delete "$SMPROGRAMS\${STARTMENU_FOLDER}\Désinstaller HunterEvolution.lnk"
            RMDir  "$SMPROGRAMS\${STARTMENU_FOLDER}"

            ; Ne PAS supprimer les sauvegardes utilisateur
            ; RMDir /r "${SAVE_DIR}"

            RMDir /r "$INSTDIR"
          SectionEnd
          NSIS


          echo "⚙️  Compilation NSIS…"
          makensis \
            -DAPP_DIR="${APP_DIR}" \
            -DINSTALLER_DIR="${INSTALLER_DIR}" \
            -DTAG_NAME="${TAG_NAME}" \
            -DICO_PATH="${ICO_PATH}" \
            "${NSI}"

          echo "✅ Installateur généré: ${INSTALLER_DIR}/HunterEvolution-${TAG_NAME}.exe"

