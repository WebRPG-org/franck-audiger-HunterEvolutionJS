name: Déploiement Release + Installer Windows

on:
  push:
    tags:
      - '*'

jobs:
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/')
    runs-on: self-hosted

    env:
      DEST_WEB: /var/www
      BUILD_ROOT: /var/www/workspace/buildDesktop
      APP_DIR: /var/www/workspace/buildDesktop/Hunter            # dossier du build desktop
      APP_PAYLOAD: /var/www/workspace/buildDesktop/Hunter        # ce qu'on installe
      INSTALLER_DIR: /var/www/desktop                        # où déposer l'EXE final
      # --- Android ---
      ANDROID_ROOT: /var/www/workspace/buildAndroid
      ANDROID_APP: /var/www/workspace/buildAndroid/Hunter            # projet Cordova
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_BUILD_TOOLS: 34.0.0
      ANDROID_PLATFORM: android-34
      ANDROID_OUT_DIR: /var/www/android

    steps:
      - name: Prepare (cloner le tag et copier workspace)
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          echo "🏷 TAG: ${TAG_NAME}"

          rm -rf ./tmpRelease
          mkdir ./tmpRelease
          cd ./tmpRelease

          echo "📥 Clone du repo @ tag ${TAG_NAME}"
          git clone --branch "${TAG_NAME}" --depth 1 https://github.com/franck-audiger/HunterEvolutionJS.git .

          echo "🔎 Vérifications de base…"
          for d in data fonts js icon img audio movies workspace; do
            [ -d "./$d" ] || { echo "❌ Dossier manquant: $d"; exit 1; }
          done

          echo "📁 Sync workspace vers ${DEST_WEB}/workspace"
          mkdir -p "${DEST_WEB}/workspace"
          cp -vr ./workspace/* "${DEST_WEB}/workspace/"

          cd ..

      - name: Release (copie vers /var/www)
        run: |
          set -euo pipefail

          DEST_GAME="${DEST_WEB}/game"

          [ -d "./tmpRelease" ] || { echo "❌ tmpRelease absent"; exit 1; }
          cd ./tmpRelease

          echo "📁 Prépare dossiers cibles…"
          mkdir -p \
            "${DEST_GAME}/data" "${DEST_GAME}/fonts" "${DEST_GAME}/icon" \
            "${DEST_GAME}/img" "${DEST_GAME}/audio" "${DEST_GAME}/movies" \
            "${DEST_GAME}/js"

          echo "📤 Copie assets vers ${DEST_GAME}"
          cp -vr ./data/*   "${DEST_GAME}/data/"
          cp -vr ./fonts/*  "${DEST_GAME}/fonts/"
          cp -vr ./icon/*   "${DEST_GAME}/icon/"
          cp -vr ./img/*    "${DEST_GAME}/img/"
          cp -vr ./audio/*  "${DEST_GAME}/audio/"
          cp -vr ./movies/* "${DEST_GAME}/movies/"
          cp -vr ./js/*     "${DEST_GAME}/js/"

          echo "🧱 Copie vers build web (Windows payload)"
          PAYLOAD_WWW="${BUILD_ROOT}/Hunter/www"
          mkdir -p \
            "${PAYLOAD_WWW}/data" "${PAYLOAD_WWW}/fonts" "${PAYLOAD_WWW}/icon" \
            "${PAYLOAD_WWW}/img" "${PAYLOAD_WWW}/audio" "${PAYLOAD_WWW}/movies" \
            "${PAYLOAD_WWW}/js"
          cp -vr ./data/*   "${PAYLOAD_WWW}/data/"
          cp -vr ./fonts/*  "${PAYLOAD_WWW}/fonts/"
          cp -vr ./icon/*   "${PAYLOAD_WWW}/icon/"
          cp -vr ./img/*    "${PAYLOAD_WWW}/img/"
          cp -vr ./audio/*  "${PAYLOAD_WWW}/audio/"
          cp -vr ./movies/* "${PAYLOAD_WWW}/movies/"
          cp -vr ./js/*     "${PAYLOAD_WWW}/js/"

          echo "🗂️  Fichiers site -> ${DEST_WEB}"
          mkdir -p "${DEST_WEB}/desktop"
          cp -v ./site/desktop/index.php   "${DEST_WEB}/desktop/index.php"
          cp -v ./site/bug-reports.php     "${DEST_WEB}/bug-reports.php"
          cp -v ./site/favicon.ico         "${DEST_WEB}/favicon.ico"
          cp -v ./site/feedback.php        "${DEST_WEB}/feedback.php"
          cp -v ./site/contact.php         "${DEST_WEB}/contact.php"
          cp -v ./site/icon.png            "${DEST_WEB}/icon.png"
          cp -v ./site/icon-144.png        "${DEST_WEB}/icon-144.png" || true
          cp -v ./site/icon-192.png        "${DEST_WEB}/icon-192.png" || true
          cp -v ./site/icon-36.png         "${DEST_WEB}/icon-36.png"  || true
          cp -v ./site/icon-48.png         "${DEST_WEB}/icon-48.png"  || true
          cp -v ./site/icon-72.png         "${DEST_WEB}/icon-72.png"  || true
          cp -v ./site/icon-96.png         "${DEST_WEB}/icon-96.png"  || true
          cp -v ./site/index.php           "${DEST_WEB}/index.php"
          cp -v ./site/lang.php            "${DEST_WEB}/lang.php"
          cp -v ./site/en.png              "${DEST_WEB}/en.png"        || true
          cp -v ./site/fr.png              "${DEST_WEB}/fr.png"        || true
          cp -v ./site/header.php          "${DEST_WEB}/header.php"
          cp -v ./site/release-note.php    "${DEST_WEB}/release-note.php"
          cp -v ./site/style.css           "${DEST_WEB}/style.css"

          cd ..

      - name: Générer l’installateur Windows (NSIS) + icône cohérente
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          mkdir -p "${INSTALLER_DIR}" "${APP_DIR}/www/icon"

          echo "🖼️  Conversion icon.png -> .ico pour l'installateur et les raccourcis"
          ICON_SRC=""
          if [ -f "${DEST_WEB}/icon.png" ]; then
            ICON_SRC="${DEST_WEB}/icon.png"
          elif [ -f "${APP_DIR}/www/icon/icon.png" ]; then
            ICON_SRC="${APP_DIR}/www/icon/icon.png"
          elif [ -f "${APP_DIR}/icon.png" ]; then
            ICON_SRC="${APP_DIR}/icon.png"
          else
            echo "❌ icon.png introuvable (cherche ${DEST_WEB}/icon.png en priorité)."; exit 1
          fi

          ICO_PATH="${BUILD_ROOT}/installer_icon.ico"
          if command -v magick >/dev/null 2>&1; then
            magick "${ICON_SRC}" -resize 256x256 "${ICO_PATH}"
          else
            convert "${ICON_SRC}" -resize 256x256 "${ICO_PATH}"
          fi

          # Fournir l'icône aux raccourcis
          cp -f "${ICO_PATH}" "${APP_DIR}/www/icon/icon.ico"

          echo "📝 Génération du script NSIS…"
          NSI="${BUILD_ROOT}/HunterInstaller.nsi"
          cat > "${NSI}" <<'NSIS'
          !include "MUI2.nsh"
          !define APP_NAME "HunterEvolution"
          !define COMPANY  "HunterEvolution"
          !define APP_VERSION "${TAG_NAME}"
          !define INSTALL_DIR "$PROGRAMFILES\HunterEvolution"
          !define STARTMENU_FOLDER "HunterEvolution"
          !define PAYLOAD_DIR "${APP_DIR}"
          !define OUT_EXE "${INSTALLER_DIR}\HunterEvolution-${TAG_NAME}.exe"

          Name "${APP_NAME} ${APP_VERSION}"
          OutFile "${OUT_EXE}"
          InstallDir "${INSTALL_DIR}"
          RequestExecutionLevel admin

          !define MUI_ABORTWARNING
          !define MUI_ICON "${ICO_PATH}"
          !define MUI_UNICON "${ICO_PATH}"

          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "French"

          Section "Installer"
            SetOutPath "$INSTDIR"
            File /r "${PAYLOAD_DIR}\*.*"

            ; Cible du raccourci :
            ; 1) Game.exe si présent
            ; 2) premier *.exe trouvé
            ; 3) fallback index.html
            StrCpy $0 ""
            IfFileExists "$INSTDIR\Game.exe" 0 +2
              StrCpy $0 "$INSTDIR\Game.exe"
            IfFileExists "$0" 0 +3
              FindFirst $1 $2 "$INSTDIR\*.exe"
              StrCmp $2 "" 0 +2
              StrCpy $0 "$INSTDIR\www\index.html"

            ; Raccourcis (Bureau + Menu Démarrer)
            CreateShortCut "$DESKTOP\HunterEvolution.lnk" "$0" "" "$INSTDIR\www\icon\icon.ico" 0
            CreateDirectory "$SMPROGRAMS\${STARTMENU_FOLDER}"
            CreateShortCut "$SMPROGRAMS\${STARTMENU_FOLDER}\HunterEvolution.lnk" "$0" "" "$INSTDIR\www\icon\icon.ico" 0

            ; Désinstalleur
            WriteUninstaller "$INSTDIR\Uninstall.exe"
            CreateShortCut "$SMPROGRAMS\${STARTMENU_FOLDER}\Désinstaller HunterEvolution.lnk" "$INSTDIR\Uninstall.exe"
          SectionEnd

          Section "Uninstall"
            Delete "$SMPROGRAMS\${STARTMENU_FOLDER}\HunterEvolution.lnk"
            Delete "$SMPROGRAMS\${STARTMENU_FOLDER}\Désinstaller HunterEvolution.lnk"
            RMDir  "$SMPROGRAMS\${STARTMENU_FOLDER}"
            RMDir /r "$INSTDIR"
          SectionEnd
          NSIS

          echo "⚙️  Compilation NSIS…"
          makensis \
            -DAPP_DIR="${APP_DIR}" \
            -DINSTALLER_DIR="${INSTALLER_DIR}" \
            -DTAG_NAME="${TAG_NAME}" \
            -DICO_PATH="${ICO_PATH}" \
            "${NSI}"

          echo "✅ Installateur généré: ${INSTALLER_DIR}/HunterEvolution-${TAG_NAME}.exe"

      - name: Android | Installer (SDK)
        run: |
          set -euo pipefail

          # Android SDK (cmdline-tools) — install once under /opt/android-sdk
          mkdir -p "${ANDROID_SDK_ROOT}"
          if [ ! -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            TMP=/tmp/androidcli && rm -rf "$TMP" && mkdir -p "$TMP"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O "$TMP/tools.zip"
            mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
            unzip -q "$TMP/tools.zip" -d "${ANDROID_SDK_ROOT}/cmdline-tools"
            # Le zip crée un dossier "cmdline-tools"; on le renomme "latest" si besoin
            if [ -d "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" ]; then
              mv "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools"/* "${ANDROID_SDK_ROOT}/cmdline-tools/latest"/
              rmdir "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools"
            fi
            rm -rf "$TMP"
          fi

          # PATH pour sdkmanager/adb/zipalign
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}"
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}:$PATH"

          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "build-tools;${ANDROID_BUILD_TOOLS}" "platforms;${ANDROID_PLATFORM}" >/dev/null

          # Dossiers de sortie
          mkdir -p "${ANDROID_OUT_DIR}"

      - name: Android | Préparer le payload Cordova (www)
        run: |
          set -euo pipefail
          # Réutilise les sources déjà clonées avant (tmpRelease)
          [ -d "./tmpRelease" ] || { echo "❌ tmpRelease absent"; exit 1; }
          cd ./tmpRelease

          # Vérifications
          for d in data fonts js icon img audio movies; do
            [ -d "./$d" ] || { echo "❌ Dossier manquant: $d"; exit 1; }
          done

          # Préparer le www de Cordova
          mkdir -p "${ANDROID_APP}/www"
          # Nettoyer www pour éviter des vieux fichiers
          rm -rf "${ANDROID_APP}/www/"*
          mkdir -p \
            "${ANDROID_APP}/www/data" "${ANDROID_APP}/www/fonts" "${ANDROID_APP}/www/icon" \
            "${ANDROID_APP}/www/img" "${ANDROID_APP}/www/audio" "${ANDROID_APP}/www/movies" \
            "${ANDROID_APP}/www/js"

          cp -vr ./data/*   "${ANDROID_APP}/www/data/"
          cp -vr ./fonts/*  "${ANDROID_APP}/www/fonts/"
          cp -vr ./icon/*   "${ANDROID_APP}/www/icon/"
          cp -vr ./img/*    "${ANDROID_APP}/www/img/"
          cp -vr ./audio/*  "${ANDROID_APP}/www/audio/"
          cp -vr ./movies/* "${ANDROID_APP}/www/movies/"
          cp -vr ./js/*     "${ANDROID_APP}/www/js/"

          # index.html (si besoin) — sinon adapte selon ton projet
          if [ -f ./site/mobile/index.html ]; then
            cp -v ./site/mobile/index.html "${ANDROID_APP}/www/index.html"
          elif [ -f ./site/index.html ]; then
            cp -v ./site/index.html "${ANDROID_APP}/www/index.html"
          else
            # fallback minimal si pas d'index
            echo "<!doctype html><html><head><meta charset='utf-8'><title>HunterEvolution</title></head><body><h1>HunterEvolution</h1></body></html>" > "${ANDROID_APP}/www/index.html"
          fi

      - name: Android | Ajouter plateforme & plugins Cordova si nécessaire
        run: |
          set -euo pipefail
          cd "${ANDROID_APP}"

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}"
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}:$PATH"

          # Si le projet Cordova n'a pas encore la plateforme android, on l'ajoute
          if [ ! -d "platforms/android" ]; then
            cordova platform add android@13 --no-interactive
          fi

          # Exemple de plugins (ajoute les tiens ici si besoin)
          # cordova plugin add cordova-plugin-whitelist
          # cordova plugin add cordova-plugin-splashscreen

          cordova prepare android --no-interactive

      - name: Android | Build release Cordova
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd "${ANDROID_APP}"

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}"
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}:$PATH"

          cordova build android --release --no-interactive

          # APK unsigned par défaut :
          APK_UNSIGNED="platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$APK_UNSIGNED" ]; then
            echo "❌ APK non trouvé: $APK_UNSIGNED"; ls -R platforms/android/app/build/outputs || true; exit 1
          fi

          # Si des secrets de signature sont fournis, on signe + zipalign
          # Secrets attendus (facultatif) :
          #   ANDROID_KEYSTORE_B64 : keystore .jks en base64
          #   ANDROID_KEY_ALIAS
          #   ANDROID_KEY_PASS
          if [ -n "${ANDROID_KEYSTORE_B64:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASS:-}" ]; then
            echo "🔐 Signature release avec keystore fourni…"
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/keystore.jks

            # signer
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore /tmp/keystore.jks -storepass "$ANDROID_KEY_PASS" -keypass "$ANDROID_KEY_PASS" \
              "$APK_UNSIGNED" "$ANDROID_KEY_ALIAS"

            # zipalign
            ALIGN="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/zipalign"
            OUT_APK="${ANDROID_OUT_DIR}/HunterEvolution-${TAG_NAME}.apk"
            "$ALIGN" -f 4 "$APK_UNSIGNED" "$OUT_APK"
            echo "✅ APK signé: $OUT_APK"
          else
            OUT_APK="${ANDROID_OUT_DIR}/HunterEvolution-${TAG_NAME}-unsigned.apk"
            cp -v "$APK_UNSIGNED" "$OUT_APK"
            echo "ℹ️  APK non signé: $OUT_APK"
          fi
          echo "🧹 Nettoyage tmpRelease…"
          rm -rf ~/tmpRelease
