name: Déploiement Release + Installer Windows

on:
  push:
    tags:
      - '*'

jobs:
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/')
    runs-on: self-hosted

    env:
      DEST_WEB: /var/www
      BUILD_ROOT: /var/www/workspace/buildDesktop
      APP_DIR: /var/www/workspace/buildDesktop/Hunter            # dossier du build desktop
      APP_PAYLOAD: /var/www/workspace/buildDesktop/Hunter        # ce qu'on installe
      INSTALLER_DIR: /var/www/desktop                            # où déposer l'EXE final
      INSTALLER_TMP_DIR: /var/www/workspace/buildDesktop/tmp    # où déposer l'EXE final
      # --- Android ---
      ANDROID_ROOT: /var/www/workspace/buildAndroid
      ANDROID_APP: /var/www/workspace/buildAndroid/Hunter        # projet Cordova
      ANDROID_SDK_ROOT: /opt/hunter/android-sdk
      ANDROID_BUILD_TOOLS: 34.0.0
      ANDROID_PLATFORM: android-34
      ANDROID_OUT_DIR: /var/www/android

    steps:
      - name: Vérifier format du tag
        id: tagcheck
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^V[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "valid=true" >> $GITHUB_OUTPUT
          else
            echo "valid=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare (cloner le tag et copier workspace)
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          echo "🏷 TAG: ${TAG_NAME}"

          rm -rf ./tmpRelease
          mkdir ./tmpRelease
          cd ./tmpRelease

          echo "📥 Clone du repo @ tag ${TAG_NAME}"
          git clone --branch "${TAG_NAME}" --depth 1 https://github.com/franck-audiger/HunterEvolutionJS.git .

          echo "🔎 Vérifications de base…"
          for d in data fonts js icon img audio movies workspace; do
            [ -d "./$d" ] || { echo "❌ Dossier manquant: $d"; exit 1; }
          done

          cd ..

      - name: Release Game (copie vers /var/www)
        if: steps.tagcheck.outputs.valid == 'true'
        run: |
          set -euo pipefail

          DEST_GAME="${DEST_WEB}/game"

          [ -d "./tmpRelease" ] || { echo "❌ tmpRelease absent"; exit 1; }
          cd ./tmpRelease

          echo "📁 Prépare dossiers cibles…"
          mkdir -p \
            "${DEST_GAME}/data" "${DEST_GAME}/fonts" "${DEST_GAME}/icon" \
            "${DEST_GAME}/img" "${DEST_GAME}/audio" "${DEST_GAME}/movies" \
            "${DEST_GAME}/js"

          echo "📤 Copie assets vers ${DEST_GAME}"
          cp -vr ./data/*   "${DEST_GAME}/data/"
          cp -vr ./fonts/*  "${DEST_GAME}/fonts/"
          cp -vr ./icon/*   "${DEST_GAME}/icon/"
          cp -vr ./img/*    "${DEST_GAME}/img/"
          cp -vr ./audio/*  "${DEST_GAME}/audio/"
          cp -vr ./movies/* "${DEST_GAME}/movies/"
          cp -vr ./js/*     "${DEST_GAME}/js/"
          
          PLACEHOLDER="XXX_URL_DEBUG_INI_XXX"
          VALUE="/game/debug.ini"

          ESCAPED=$(printf '%s\n' "$VALUE" | sed -e 's/[\/&]/\\&/g')

          sed -i "s|$PLACEHOLDER|$ESCAPED|g" $DEST_GAME/js/plugins/ATB_Hunter_Core.js

          echo "🧱 Copie vers build web (Windows payload)"
          PAYLOAD_WWW="${BUILD_ROOT}/Hunter/www"
          mkdir -p \
            "${PAYLOAD_WWW}/data" "${PAYLOAD_WWW}/fonts" "${PAYLOAD_WWW}/icon" \
            "${PAYLOAD_WWW}/img" "${PAYLOAD_WWW}/audio" "${PAYLOAD_WWW}/movies" \
            "${PAYLOAD_WWW}/js"
          cp -vr ./data/*   "${PAYLOAD_WWW}/data/"
          cp -vr ./fonts/*  "${PAYLOAD_WWW}/fonts/"
          cp -vr ./icon/*   "${PAYLOAD_WWW}/icon/"
          cp -vr ./img/*    "${PAYLOAD_WWW}/img/"
          cp -vr ./audio/*  "${PAYLOAD_WWW}/audio/"
          cp -vr ./movies/* "${PAYLOAD_WWW}/movies/"
          cp -vr ./js/*     "${PAYLOAD_WWW}/js/"

          cd ..

      - name: Release Site (copie vers /var/www)
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          DEST_GAME="${DEST_WEB}/game"

          [ -d "./tmpRelease" ] || { echo "❌ tmpRelease absent"; exit 1; }
          cd ./tmpRelease
          
          echo "🗂️  Fichiers site -> ${DEST_WEB}"
          mkdir -p "${DEST_WEB}/desktop"
          cp -v ./site/desktop/index.php   "${DEST_WEB}/desktop/index.php"
          cp -v ./site/desktop/install.php "${DEST_WEB}/desktop/install.php"
          cp -v ./site/desktop/img/*.png   "${DEST_WEB}/desktop/img/"
          cp -v ./site/bug-reports.php     "${DEST_WEB}/bug-reports.php"
          cp -v ./site/favicon.ico         "${DEST_WEB}/favicon.ico"
          cp -v ./site/feedback.php        "${DEST_WEB}/feedback.php"
          cp -v ./site/contact.php         "${DEST_WEB}/contact.php"
          cp -v ./site/icon.png            "${DEST_WEB}/icon.png"
          cp -v ./site/icon-144.png        "${DEST_WEB}/icon-144.png" || true
          cp -v ./site/icon-192.png        "${DEST_WEB}/icon-192.png" || true
          cp -v ./site/icon-36.png         "${DEST_WEB}/icon-36.png"  || true
          cp -v ./site/icon-48.png         "${DEST_WEB}/icon-48.png"  || true
          cp -v ./site/icon-72.png         "${DEST_WEB}/icon-72.png"  || true
          cp -v ./site/icon-96.png         "${DEST_WEB}/icon-96.png"  || true
          cp -v ./site/index.php           "${DEST_WEB}/index.php"
          cp -v ./site/lang.php            "${DEST_WEB}/lang.php"
          cp -v ./site/en.png              "${DEST_WEB}/en.png"        || true
          cp -v ./site/fr.png              "${DEST_WEB}/fr.png"        || true
          cp -v ./site/header.php          "${DEST_WEB}/header.php"
          cp -v ./site/release-note.php    "${DEST_WEB}/release-note.php"
          cp -v ./site/style.css           "${DEST_WEB}/style.css"
          cp -v ./site/disclaimer.php      "${DEST_WEB}/disclaimer.php"
          cp -v ./site/index-assets.php      "${DEST_WEB}/desktop-assets/index.php"

          cd ..

      - name: Préparer les archives assets (7z) pour installeur web
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          PAYLOAD_ROOT="${BUILD_ROOT}/Hunter"
          
          ASSET_DIR="${DEST_WEB}/desktop-assets"
          ZIP_PATH="${ASSET_DIR}/${TAG_NAME}.7z"

          cd $PAYLOAD_ROOT

          # Crée l'archive avec tout ce qui est dans PAYLOAD_ROOT (fichiers cachés inclus)
          7z a -t7z "$ZIP_PATH" ./*

          echo "✅ Archive générée : $ZIP_PATH"

      - name: Générer l’installateur Windows (NSIS) + icône cohérente
        if: steps.tagcheck.outputs.valid == 'true'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          mkdir -p "${INSTALLER_DIR}" "${INSTALLER_TMP_DIR}" "${APP_DIR}/www/icon"

          echo "🖼️  Conversion icon.png -> .ico pour l'installateur et les raccourcis"
          ICON_SRC=""
          if [ -f "${DEST_WEB}/icon.png" ]; then
            ICON_SRC="${DEST_WEB}/icon.png"
          elif [ -f "${APP_DIR}/www/icon/icon.png" ]; then
            ICON_SRC="${APP_DIR}/www/icon/icon.png"
          elif [ -f "${APP_DIR}/icon.png" ]; then
            ICON_SRC="${APP_DIR}/icon.png"
          else
            echo "❌ icon.png introuvable (cherche ${DEST_WEB}/icon.png en priorité)."; exit 1
          fi

          ICO_PATH="${BUILD_ROOT}/installer_icon.ico"
          if command -v magick >/dev/null 2>&1; then
            magick "${ICON_SRC}" -resize 256x256 "${ICO_PATH}"
          else
            convert "${ICON_SRC}" -resize 256x256 "${ICO_PATH}"
          fi

          cp -f "${ICO_PATH}" "${APP_DIR}/www/icon/icon.ico"

          ZIP_PATH="${DEST_WEB}/desktop-assets/${TAG_NAME}.7z"

          # Taille en octets
          ARCHIVE_SIZE_BYTES=$(stat -c%s "$ZIP_PATH")
          # Converti en kilo-octets (arrondi vers le haut) — unité attendue par NSIS
          ARCHIVE_SIZE_KB=$(( (ARCHIVE_SIZE_BYTES + 1023) / 1024 ))
          # Joli affichage en Mo pour le texte des pages
          ARCHIVE_SIZE_MB=$(awk "BEGIN {printf \"%.1f\", $ARCHIVE_SIZE_BYTES/1048576}")

          echo "📦 Archive: $ZIP_PATH — ${ARCHIVE_SIZE_MB} Mo"

          echo "📝 Génération du script NSIS…"
          NSI="${BUILD_ROOT}/HunterInstaller.nsi"

          cat > "${NSI}" <<'NSIS'
          Unicode true
          !include "MUI2.nsh"
          !include "FileFunc.nsh"
          !include "LogicLib.nsh"

          !define APP_NAME "HunterEvolution"
          !define COMPANY  "HunterEvolution"
          !define APP_VERSION "${TAG_NAME}"
          !define INSTALL_DIR "$PROGRAMFILES\HunterEvolution"
          !define STARTMENU_FOLDER "HunterEvolution"
          !define OUT_EXE "${INSTALLER_DIR}/HunterEvolution-${TAG_NAME}.exe"

          Var RemoteArchiveURL
          Var StartTarget

          Name "${APP_NAME} ${APP_VERSION}"
          OutFile "${OUT_EXE}"
          InstallDir "${INSTALL_DIR}"
          RequestExecutionLevel admin

          !define MUI_ABORTWARNING
          !define MUI_ICON "${ICO_PATH}"
          !define MUI_UNICON "${ICO_PATH}"

          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !define MUI_FINISHPAGE_RUN
          !define MUI_FINISHPAGE_RUN_TEXT "Démarrer l'application"
          !define MUI_FINISHPAGE_RUN_FUNCTION LaunchApp
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "French"

          Section "Installer" SEC_MAIN

            Function .onInit
              SetShellVarContext current
              StrCpy $RemoteArchiveURL "https://hunter-evolution-game.com/desktop-assets/${TAG_NAME}.7z"
              SectionSetSize ${SEC_MAIN} ${ARCHIVE_SIZE_KB}
            FunctionEnd

            Function DownloadFile
              Exch $1
              Exch
              Exch $0

              ${GetParent} $1 $2
              CreateDirectory "$2"
              Delete "$1"

              inetc::get /POPUP "" /RESUME "" /CAPTION "Téléchargement de $0" /NOIEPROXY "$0" "$1"
              Pop $R0
              StrCmp $R0 "OK" done
              MessageBox MB_OK "Erreur téléchargement :$0$\nCode: $R0"
              Abort
            done:
            FunctionEnd

            Function ExtractArchive
              Exch $1 ; Destination
              Exch
              Exch $0 ; Archive path

              Nsis7z::Extract "$0" "$1"
              Pop $R0
              DetailPrint "Résultat extraction : $R0"
            FunctionEnd

            ${If} ${FileExists} "$INSTDIR\*.*"
              RMDir /r "$INSTDIR"
            ${EndIf}

            CreateDirectory "$INSTDIR"
            SetOutPath "$INSTDIR"

            ; 1. Télécharger l’archive .7z
            StrCpy $0 "$RemoteArchiveURL"
            StrCpy $1 "$INSTDIR\payload.7z"
            Push $0
            Push $1
            Call DownloadFile

            ; 2. Extraction via Nsis7z
            Push "$1"
            Push "$INSTDIR"
            Call ExtractArchive
            Delete "$1"

            ; 3. Raccourcis
            StrCpy $StartTarget "$INSTDIR\Game.exe"
            ${If} ${FileExists} "$INSTDIR\www\icon\icon.ico"
              CreateShortCut "$DESKTOP\HunterEvolution.lnk" "$StartTarget" "" "$INSTDIR\www\icon\icon.ico" 0
              CreateShortCut "$SMPROGRAMS\${STARTMENU_FOLDER}\HunterEvolution.lnk" "$StartTarget" "" "$INSTDIR\www\icon\icon.ico" 0
            ${Else}
              CreateShortCut "$DESKTOP\HunterEvolution.lnk" "$StartTarget"
              CreateShortCut "$SMPROGRAMS\${STARTMENU_FOLDER}\HunterEvolution.lnk" "$StartTarget"
            ${EndIf}

            ; 4. Uninstall
            WriteUninstaller "$INSTDIR\Uninstall.exe"
            CreateShortCut "$SMPROGRAMS\${STARTMENU_FOLDER}\Désinstaller HunterEvolution.lnk" "$INSTDIR\Uninstall.exe"
          SectionEnd

          Function LaunchApp
            ExecShell "open" "$INSTDIR\Game.exe"
          FunctionEnd

          Section "Uninstall"
            Delete "$DESKTOP\HunterEvolution.lnk"
            Delete "$SMPROGRAMS\${STARTMENU_FOLDER}\HunterEvolution.lnk"
            Delete "$SMPROGRAMS\${STARTMENU_FOLDER}\Désinstaller HunterEvolution.lnk"
            RMDir "$SMPROGRAMS\${STARTMENU_FOLDER}"
            RMDir /r "$INSTDIR"
          SectionEnd
          NSIS
          

          echo "⚙️  Compilation NSIS…"
          makensis \
            -DAPP_DIR="${APP_DIR}" \
            -DINSTALLER_DIR="${INSTALLER_TMP_DIR}" \
            -DTAG_NAME="${TAG_NAME}" \
            -DICO_PATH="${ICO_PATH}" \
            -DARCHIVE_SIZE_KB="${ARCHIVE_SIZE_KB}" \
            -DARCHIVE_SIZE_MB="${ARCHIVE_SIZE_MB}" \
            "${NSI}"

          echo "✅ Installateur généré: ${INSTALLER_TMP_DIR}/HunterEvolution-${TAG_NAME}.exe"

      - name: Copier l'exe et signature de l’installateur Windows
        if: steps.tagcheck.outputs.valid == 'true'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          echo "📤 Copie de l'exe a signer…"
          scp "${INSTALLER_TMP_DIR}/HunterEvolution-${TAG_NAME}.exe" FranckAudiger@20.33.23.72:"workspace\HunterEvolution-${TAG_NAME}.exe"

          echo "🔏 Signature de l'exe"
          ssh FranckAudiger@20.33.23.72 "cd workspace && signtool sign /sha1 \"ab5c58511d5fa63fb85c443b187a47ab878f2b9f\" /tr http://time.certum.pl /td sha256 /fd sha256 /v \"HunterEvolution-${TAG_NAME}.exe\""
          
          echo "📥  Récupération de l'installateur signé…"
          scp FranckAudiger@20.33.23.72:/C:/Users/FranckAudiger/workspace/HunterEvolution-${TAG_NAME}.exe ${INSTALLER_DIR}/HunterEvolution-${TAG_NAME}.exe
          chmod 664 ${INSTALLER_DIR}/HunterEvolution-${TAG_NAME}.exe
