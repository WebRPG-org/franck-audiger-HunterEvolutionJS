name: Déploiement Release via SSH

on:
  push:
    tags:
      - '*'

jobs:
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du projet à ce tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # important pour que le tag soit récupéré
          ref: ${{ github.ref_name }}

      - name: Installer sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Exécuter le script release.sh sur le serveur
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.FTP_PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # 1. Préparation du dossier distant
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST -p $SSH_PORT \
            "rm -rf /home/$SSH_USER/domains/hunter-evolution-game.com/public_html/workspace/tmpRelease && mkdir -p /home/$SSH_USER/domains/hunter-evolution-game.com/public_html/workspace/tmpRelease"

          # 2. Upload des fichiers locaux vers tmpRelease/
          sshpass -p "$SSH_PASSWORD" scp -P $SSH_PORT -r ./ $SSH_USER@$SSH_HOST:/home/$SSH_USER/domains/hunter-evolution-game.com/public_html/workspace/tmpRelease/

          # 3. Exécution du script distant avec le tag
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST -p $SSH_PORT \
            "cd /home/$SSH_USER/domains/hunter-evolution-game.com/public_html/workspace && bash release.sh $TAG_NAME"