name: Déploiement Dev via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Installer sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Exécuter le script distant avec sshpass
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.FTP_PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          # 1. Préparation du dossier distant
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST -p $SSH_PORT \
            "rm -rf /home/$SSH_USER/domains/hunter-evolution-game.com/public_html/workspace/tmp && mkdir -p /home/$SSH_USER/domains/hunter-evolution-game.com/public_html/workspace/tmp"

          # 2. Upload des fichiers locaux vers tmp/
          sshpass -p "$SSH_PASSWORD" scp -P $SSH_PORT -r ./ $SSH_USER@$SSH_HOST:/home/$SSH_USER/domains/hunter-evolution-game.com/public_html/workspace/tmp/

          # 3. Exécution du script distant
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST -p $SSH_PORT "cd /home/$SSH_USER/domains/hunter-evolution-game.com/public_html/workspace && bash deploy-dev.sh"
