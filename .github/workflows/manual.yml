name: Déploiement Dev

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Déployer les fichiers modifiés uniquement
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          lftp -d -e "
            set ftp:ssl-allow no
            set ftp:list-options -a;
            set ssl:verify-certificate no;

            open -u $FTP_USER,$FTP_PASS $FTP_HOST;

            put -n -O /domains/hunter-evolution-game.com/public_html/game-dev index.html;
            put -n -O /domains/hunter-evolution-game.com/public_html/game-dev icon.png;
            put -n -O /domains/hunter-evolution-game.com/public_html/game-dev package.json;

            mirror -R --only-newer data /domains/hunter-evolution-game.com/public_html/game-dev/data;
            mirror -R --only-newer fonts /domains/hunter-evolution-game.com/public_html/game-dev/fonts;
            mirror -R --only-newer icon /domains/hunter-evolution-game.com/public_html/game-dev/icon;
            mirror -R --only-newer img /domains/hunter-evolution-game.com/public_html/game-dev/img;
            mirror -R --only-newer json /domains/hunter-evolution-game.com/public_html/game-dev/json;
            mirror -R --only-newer movies /domains/hunter-evolution-game.com/public_html/game-dev/movies;

            bye;
          "