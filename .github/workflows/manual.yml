name: Déploiement Dev via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Se connecter au serveur et exécuter le script
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            sh /home/u116286536/domains/hunter-evolution-game.com/public_html/workspace/deploy-dev.sh