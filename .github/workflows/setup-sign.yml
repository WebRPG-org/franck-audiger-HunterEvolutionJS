name: Preparation Signature Windows (manuel)

on:
  workflow_dispatch:
    inputs:
      token:
        description: "Token SimplySign"
        required: true
        type: string

jobs:
  sign:
    runs-on: self-hosted
    steps:

      - name: Lancer login avec token
        env:
          TOKEN: ${{ inputs.token }}
        run: |
          set -euo pipefail

          echo "📝 Login SimplySign…"
          ssh FranckAudiger@20.33.23.72 "powershell -NoProfile -Command \"\$A = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument '-NoProfile -ExecutionPolicy Bypass -File \"\"C:\Users\FranckAudiger\workspace\SimplySignAutoLogin.ps1\"\" ${inputs.token}'; \$P = New-ScheduledTaskPrincipal -UserId 'FranckAudiger' -LogonType Interactive -RunLevel Highest; Register-ScheduledTask -TaskName 'RunLogin' -Action \$A -Principal \$P -Force\""
          ssh FranckAudiger@20.33.23.72 "powershell -NoProfile -Command Start-ScheduledTask -TaskName 'RunLogin'"

          echo "⏳ Attente 30 secondes pour laisser l’agent se connecter…"
          sleep 30
