<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="viewport" content="user-scalable=no">
        <link rel="icon" href="../icon.png" type="image/png">
        <link rel="apple-touch-icon" href="icon/icon.png">
        <link rel="stylesheet" type="text/css" href="fonts/gamefont.css">
        <link rel="stylesheet" href="../style.css">
        
        <style>
            #ui-bar {
                position: fixed;
                top: 10px;
                left: 10px;
                z-index: 9999;
                background: rgba(0, 0, 0, 0.6);
                padding: 5px 10px;
                border-radius: 6px;
                font-family: sans-serif;
            }

            #ui-bar button {
                color: white;
                background: #222;
                border: 1px solid #555;
                padding: 5px 10px;
                margin-right: 5px;
                cursor: pointer;
                border-radius: 4px;
            }

            #ui-bar button:hover {
                background: #444;
            }
            
        </style>
        <title>Hunter x Hunter Evolution</title>
    </head>
	<div id="ui-bar">
		<button id="btn-fullscreen">🖵 Plein écran</button>
	</div>
    <body style="background-color: black">
        <script type="text/javascript" src="js/libs/pixi.js"></script>
        <script type="text/javascript" src="js/libs/pixi-tilemap.js"></script>
        <script type="text/javascript" src="js/libs/pixi-picture.js"></script>
        <script type="text/javascript" src="js/libs/fpsmeter.js"></script>
        <script type="text/javascript" src="js/libs/lz-string.js"></script>
        <script type="text/javascript" src="js/libs/iphone-inline-video.browser.js"></script>
        <script type="text/javascript" src="js/rpg_core.js"></script>
        <script type="text/javascript" src="js/rpg_managers.js"></script>
        <script type="text/javascript" src="js/rpg_objects.js"></script>
        <script type="text/javascript" src="js/rpg_scenes.js"></script>
        <script type="text/javascript" src="js/rpg_sprites.js"></script>
        <script type="text/javascript" src="js/rpg_windows.js"></script>
        <script type="text/javascript" src="js/plugins.js"></script>
        <script type="text/javascript" src="js/main.js"></script>
    </body>
 
    <script>
        let stateFullscreen = false;

        document.getElementById("btn-fullscreen").addEventListener("click", () => {
            window.stateFullscreen = !window.stateFullscreen;

            if (window.stateFullscreen) {
                const w = window.innerWidth;
                const h = window.innerHeight;
                SceneManager.resizeScreen(w, h);
                document.getElementById("btn-fullscreen").innerText = "🗗 Réduire";
            } else {
                SceneManager.resizeScreen(816, 624); // taille initiale par défaut
                document.getElementById("btn-fullscreen").innerText = "🖵 Plein écran";
            }
        });
        
    </script>
</html>
